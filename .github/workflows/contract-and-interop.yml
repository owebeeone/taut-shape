name: Taut shape contract and interop

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-engines-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out contract
        uses: actions/checkout@v4
        with:
          path: workspace/taut-shape
      - name: Check out Taut runtime
        uses: actions/checkout@v4
        with:
          repository: owebeeone/taut
          path: workspace/taut
      - name: Check out Rust engine
        uses: actions/checkout@v4
        with:
          repository: owebeeone/taut-shape-rs
          path: workspace/taut-shape-rs
      - name: Check out TypeScript engine
        uses: actions/checkout@v4
        with:
          repository: owebeeone/taut-shape-ts
          path: workspace/taut-shape-ts
      - name: Check out Python engine
        uses: actions/checkout@v4
        with:
          repository: owebeeone/taut-shape-py
          path: workspace/taut-shape-py
      - name: Check out required Glial consumer
        uses: actions/checkout@v4
        with:
          repository: owebeeone/glial-runtime
          path: workspace/glial

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PNPM and Python test runner
        run: |
          npm install --global pnpm@10.24.0
          python -m pip install build pytest
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install TypeScript dependencies
        working-directory: workspace/taut-shape-ts
        run: pnpm install --frozen-lockfile
      - name: Test Rust engine and no-std surface
        working-directory: workspace/taut-shape-rs
        run: |
          cargo build --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build -p taut-shape --no-default-features
      - name: Test TypeScript engine
        working-directory: workspace/taut-shape-ts
        run: |
          pnpm typecheck
          pnpm test
      - name: Test Python engine
        working-directory: workspace/taut-shape-py
        env:
          PYTHONPATH: ../taut/src:src
        run: |
          python -m pytest -q
          python -m build

      - name: Check compatibility, IR, and every corpus
        working-directory: workspace/taut-shape
        run: |
          python release/check_compatibility.py
          python ir/regen.py --check
          python corpus/fold_gen.py --check
          python corpus/value_gen.py --check
          python corpus/atom_gen.py --check
          python corpus/gen.py --check
          python corpus/stream_gen.py --check
          python corpus/swmr_gen.py --check
          python corpus/snapshot_delta_gen.py --check
          python corpus/crdt_gen.py --check
          python corpus/crdt_convergence_gen.py --check
      - name: Run full and dependency-isolated live matrices
        working-directory: workspace/taut-shape
        env:
          PYTHONPATH: ../taut-shape-py/src:../taut/src
        run: |
          python -m pytest -q matrix/driver.py matrix/test_harness.py release/test_compatibility.py
          python -S matrix/driver.py
      - name: Require released versions, semver consumer pins, and a clean tree
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: workspace/taut-shape
        run: python release/check_compatibility.py --release
